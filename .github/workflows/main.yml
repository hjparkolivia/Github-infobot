name: Daily Marketing Bot Run
run-name: Daily marketing / ${{ inputs.mode || 'scheduled' }}

on:
  schedule:
    # Prepare before 09:00 KST; bot waits only AFTER search/curation.
    # GitHub schedule delivery is best effort, not an exact-time guarantee.
    - cron: "42 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (연결/오류 테스트는 AI 호출 없음)"
        type: choice
        default: run
        options:
          - run
          - scheduled
          - guard-check
          - telegram-test
          - error-alert-test

permissions:
  contents: write # persist only public recommendation names in state/sent.json
  actions: read

concurrency:
  group: daily-app-marketing-bot
  cancel-in-progress: false

jobs:
  send-digest:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Test search and notification paths
        run: python -m unittest discover -v

      - name: Run marketing bot
        id: bot
        env:
          GEMINI_KEY: ${{ secrets.APIKEY_GEMINI }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}
          BOT_MODE: ${{ inputs.mode || 'run' }}
          DAILY_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.mode == 'scheduled' }}
        run: |
          case "$BOT_MODE" in
            telegram-test) python bot.py --test-telegram ;;
            error-alert-test) python bot.py --test-error ;;
            guard-check) python daily.py watchdog --dry-run ;;
            *) python daily.py run ;;
          esac

      # Runs even if dependency installation/import failed before bot.py could
      # notify. No requests/google SDK dependency, and no raw token-bearing errors.
      - name: Notify Telegram on workflow failure
        if: ${{ failure() && steps.bot.outputs.error_notified != 'true' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          token = os.getenv('TELEGRAM_TOKEN', '').strip()
          chat = os.getenv('TELEGRAM_CHAT_ID', '').strip()
          if not token or not chat:
              sys.exit('Telegram 오류 알림 불가: TOKEN 또는 CHAT_ID Secret 누락')
          link = (os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                  + '/actions/runs/' + os.environ['GITHUB_RUN_ID'])
          message = '🚨 앱 마케팅 워크플로 실패\n설치·실행·봇 알림 단계 중 오류가 발생했습니다.\n실행 로그: ' + link
          payload = json.dumps({'chat_id': chat, 'text': message,
                                'link_preview_options': {'is_disabled': True}}).encode()
          request = Request('https://api.telegram.org/bot' + token + '/sendMessage', data=payload,
                            headers={'Content-Type': 'application/json'}, method='POST')
          try:
              with urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if not result.get('ok'):
                  sys.exit('Telegram 오류 알림 실패: error_code=' + str(result.get('error_code')))
          except HTTPError as exc:
              sys.exit('Telegram 오류 알림 실패: HTTP ' + str(exc.code) + ' · Secret/채팅 권한 확인')
          except Exception as exc:
              sys.exit('Telegram 오류 알림 실패: ' + type(exc).__name__)
          print('워크플로 실패 알림 전송 완료')
          PY
